<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafana 看板生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/* Layout: instrument-panel workspace — top bar, left data-source rail, main column with the prompt composer
   above a 24-column Grafana-style panel grid; full-screen panel editor and JSON modal on top. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --bg: #0b0e13;
  --bg-2: #0f131a;
  --panel: #131820;
  --panel-2: #181e28;
  --line: #222a36;
  --line-2: #2e3847;
  --fg: #dce2eb;
  --fg-2: #9ea8b7;
  --fg-3: #67727f;
  --accent: #ff9a3c;
  --accent-2: #ffb56b;
  --accent-ink: #1d1206;
  --accent-soft: rgba(255, 154, 60, 0.12);
  --ok: #46c28e;
  --warn: #f2cc4a;
  --crit: #ff5f6d;
  --info: #6ea8fe;
  --font-ui: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  --r: 6px;
  --side-w: 312px;
  --top-h: 52px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--fg-3); }
.hint { color: var(--fg-3); font-size: 12px; margin: 6px 0 0; line-height: 1.55; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
kbd { font: 11px var(--font-mono); padding: 0 4px; border: 1px solid currentColor; border-radius: 3px; opacity: .55; margin-left: 2px; }
code { font-family: var(--font-mono); font-size: 12px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r);
  background: var(--panel-2); border: 1px solid var(--line-2); color: var(--fg); font-size: 13px; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover:not(:disabled) { background: #1f2632; border-color: #3a4556; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--fg); border-color: var(--line); }
.btn.xs { height: 26px; padding: 0 8px; font-size: 12px; gap: 4px; }
.btn.block { width: 100%; margin-top: 14px; }
select.btn { padding: 0 8px; appearance: auto; }
.ib { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 4px; background: transparent; border: 0; color: var(--fg-3); }
.ib:hover:not(:disabled) { background: var(--panel-2); color: var(--fg); }
.ico { flex: none; }
.in { width: 100%; height: 32px; padding: 0 10px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r); color: var(--fg); font-size: 13px; }
textarea.in { height: auto; padding: 7px 10px; resize: vertical; line-height: 1.5; }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.in.mono { font-family: var(--font-mono); font-size: 12.5px; }
.lbl { display: block; font-size: 11.5px; color: var(--fg-2); margin: 12px 0 5px; letter-spacing: .02em; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--fg-2); margin-top: 12px; cursor: pointer; }
.check.sm { margin: 0; font-size: 12.5px; }
.check input { accent-color: var(--accent); width: 14px; height: 14px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: var(--fg-2); font-size: 12.5px; padding: 0 8px; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-2); }
.seg.sm button { height: 24px; font-size: 12px; }
.seg em, .side-tabs em { font-style: normal; font: 11px var(--font-mono); color: var(--fg-3); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line-2); color: var(--fg-2); font-size: 12px; white-space: nowrap; }
.chip:hover { color: var(--fg); border-color: #3a4556; }
.chip.on { color: var(--fg); border-color: var(--accent); background: var(--accent-soft); }
.chip em { font-style: normal; font: 11px var(--font-mono); color: var(--fg-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.pill { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 3px; font-size: 11px; font-weight: 500; letter-spacing: .02em; }
.pill-ok { color: var(--ok); background: rgba(70, 194, 142, .13); }
.pill-warn { color: var(--warn); background: rgba(242, 204, 74, .13); }
.pill-crit { color: var(--crit); background: rgba(255, 95, 109, .14); }
.pill-info { color: var(--info); background: rgba(110, 168, 254, .13); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fg-3); }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(70, 194, 142, .18); }
.dot.fail { background: var(--crit); box-shadow: 0 0 0 3px rgba(255, 95, 109, .18); }
.dot.testing { background: var(--warn); animation: pulse 1s infinite; }
.spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .7s linear infinite; display: inline-block; flex: none; }
.rot { animation: rot .5s linear; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); grid-template-rows: var(--top-h) minmax(0, 1fr); height: 100%; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg-2); position: relative; z-index: 20; min-width: 0; }
.top .menu { display: none; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-cond); font-weight: 600; font-size: 16px; letter-spacing: .01em; white-space: nowrap; }
.brand em { font: 500 11px var(--font-mono); color: var(--fg-3); font-style: normal; letter-spacing: .04em; padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 3px; }
.ds-pill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--line-2); background: var(--panel); font-size: 12.5px; margin-left: 10px; min-width: 0; }
.ds-pill:hover { border-color: #3a4556; }
.ds-pill .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-sp { flex: 1; }
.side { border-right: 1px solid var(--line); background: var(--bg-2); overflow: auto; padding: 14px 16px 24px; }
.side-tabs { margin-bottom: 14px; position: sticky; top: 0; z-index: 2; }
.main { overflow: auto; padding: 18px 20px 32px; min-width: 0; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.ds-list { display: grid; gap: 4px; }
.ds-item { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px; border-radius: var(--r); border: 1px solid transparent; background: transparent; text-align: left; font-size: 13px; }
.ds-item:hover { background: var(--panel); }
.ds-item.on { background: var(--panel); border-color: var(--line-2); }
.ds-n { flex: 1; font-family: var(--font-mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-s { font-size: 11.5px; color: var(--fg-3); }
.ds-list .btn { justify-self: start; margin-top: 2px; }
.ds-card { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.ds-card-h { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 10px 0 0; }
.kv div { min-width: 0; }
.kv dt { font-size: 11px; color: var(--fg-3); }
.kv dd { margin: 0; font: 12.5px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-form { margin-top: 4px; }
.ds-log { list-style: none; margin: 12px 0 0; padding: 10px; background: #080a0e; border: 1px solid var(--line); border-radius: var(--r); font: 11.5px/1.6 var(--font-mono); display: grid; gap: 2px; }
.ds-log li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; color: var(--fg-2); word-break: break-word; }
.ds-log li.ok { color: var(--ok); }
.ds-log li.err { color: var(--crit); }
.ds-log li span { color: var(--fg-3); }
.opt.model { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.m-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 4px; border: 0; background: transparent; text-align: left; }
.m-row:hover { background: var(--panel); }
.mlist li.open .m-row { background: var(--panel); }
.m-n { flex: 1; font: 12px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-c { font: 11px var(--font-mono); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.mt { font: 10px var(--font-mono); padding: 1px 4px; border-radius: 3px; flex: none; width: 62px; text-align: center; }
.t-counter { color: #6ea8fe; background: rgba(110, 168, 254, .12); }
.t-gauge { color: #46c28e; background: rgba(70, 194, 142, .12); }
.t-histogram { color: #c38bfa; background: rgba(195, 139, 250, .12); }
.t-summary { color: #40c4c4; background: rgba(64, 196, 196, .12); }
.m-d { padding: 4px 8px 10px 78px; font-size: 12px; color: var(--fg-2); }
.m-d p { margin: 0 0 6px; }
.m-l { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.m-l code { font-size: 11px; padding: 1px 5px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); color: var(--fg-2); }
.m-a { display: flex; gap: 6px; }
.empty-s { color: var(--fg-3); font-size: 13px; padding: 16px 4px; }

/* ---------- composer ---------- */
.composer { border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); padding: 12px 14px 12px; margin-bottom: 22px; }
.cmp-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cmp-h label { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-cond); font-weight: 600; font-size: 14px; color: var(--fg); }
.cmp-h label .ico { color: var(--accent); }
.cmp-ta { width: 100%; margin-top: 10px; padding: 10px 12px; min-height: 64px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r); font-size: 14.5px; line-height: 1.6; resize: vertical; }
.cmp-ta:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cmp-f { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.ex { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.cmp-go { display: flex; align-items: center; gap: 12px; margin-left: auto; font-size: 12px; }

.gen { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.gen.open { display: block; }
.gen.err { color: var(--crit); }
.gen-msg { flex: 1; min-width: 200px; display: flex; flex-direction: column; font-size: 13px; }
.gen-msg span { color: var(--fg-3); font-size: 12px; }
.gen.err .gen-msg b { color: var(--crit); }
.gen-ok { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(70, 194, 142, .14); color: var(--ok); flex: none; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 13px; }
.steps li > div { display: flex; flex-direction: column; min-width: 0; }
.steps li span:not(.st-i):not(.spin) { color: var(--fg-3); font-size: 12px; }
.steps li.todo { opacity: .45; }
.st-i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 11px var(--font-mono); border: 1px solid var(--line-2); color: var(--fg-3); }
.steps li.done .st-i { background: rgba(70, 194, 142, .14); border-color: transparent; color: var(--ok); }
.steps li.run .st-i { border-color: var(--accent); color: var(--accent); }
.mchips code { display: inline-block; margin: 3px 4px 0 0; padding: 0 5px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); color: var(--fg-2); font-size: 11px; }
.plan { margin-top: 14px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg-2); }
.plan-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.plan-h .muted { font-size: 12px; }
.plan-cat { padding: 6px 4px 8px; border-bottom: 1px solid var(--line); }
.plan-cn { font: 600 11px var(--font-cond); color: var(--fg-3); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; }
.plan-p { display: grid; grid-template-columns: 16px 18px minmax(80px, 180px) minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.plan-p:hover { background: var(--panel); }
.plan-p input { accent-color: var(--accent); margin: 0; }
.plan-p.off .plan-t, .plan-p.off .plan-q, .plan-p.off .plan-ty { opacity: .4; }
.plan-ty { color: var(--fg-2); display: grid; }
.plan-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-q { color: var(--fg-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-f { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px; }
.gen-foot { display: flex; justify-content: flex-end; margin-top: 6px; }

/* ---------- dashboard ---------- */
.dash-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.dash-t { min-width: 0; flex: 1 1 280px; }
.title-in { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 2px 6px; margin-left: -7px; font: 600 21px/1.3 var(--font-cond); letter-spacing: .005em; text-wrap: balance; }
.title-in:hover { border-color: var(--line); }
.title-in:focus { outline: none; border-color: var(--accent); background: var(--bg-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; }
.tag { font: 11px var(--font-mono); padding: 1px 7px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg-2); }
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sel-w { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px 0 10px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel-2); color: var(--fg-2); }
.sel-w select { background: transparent; border: 0; color: var(--fg); font-size: 13px; height: 30px; }
.split { display: inline-flex; }
.split .btn:first-child { border-radius: var(--r) 0 0 var(--r); padding: 0 9px; }
.split .btn:last-child { border-radius: 0 var(--r) var(--r) 0; border-left: 0; font-family: var(--font-mono); font-size: 12px; }
.vars { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.var { display: inline-flex; align-items: stretch; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; font-size: 12.5px; }
.var span { padding: 0 10px; display: grid; place-items: center; background: var(--panel-2); color: var(--fg-2); font-family: var(--font-mono); border-right: 1px solid var(--line-2); }
.var select { background: var(--bg-2); border: 0; height: 30px; padding: 0 6px; font-family: var(--font-mono); }

.cat { margin-bottom: 16px; }
.cat-h { display: flex; align-items: center; gap: 6px; height: 30px; margin-bottom: 6px; }
.cat-tg { width: 22px; height: 22px; display: grid; place-items: center; border: 0; background: transparent; color: var(--fg-3); border-radius: 4px; transition: transform .15s; }
.cat-tg.closed { transform: rotate(-90deg); }
.cat-tg:hover { color: var(--fg); background: var(--panel); }
.cat-name { border: 0; background: transparent; font: 600 14px var(--font-cond); letter-spacing: .02em; padding: 2px 4px; border-radius: 4px; }
.cat-name:hover { background: var(--panel); }
.cat-in { font: 600 14px var(--font-cond); background: var(--bg-2); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px; width: 220px; }
.cat-count { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.cat-line { flex: 1; height: 1px; background: var(--line); margin: 0 6px; min-width: 12px; }
.cat-body { display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); grid-auto-rows: 30px; gap: 8px; }

.panel { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); grid-row: span 8; }
.panel:hover { border-color: var(--line-2); }
.panel[data-w="6"] { grid-column: span 6; } .panel[data-w="8"] { grid-column: span 8; } .panel[data-w="12"] { grid-column: span 12; }
.panel[data-w="16"] { grid-column: span 16; } .panel[data-w="18"] { grid-column: span 18; } .panel[data-w="24"] { grid-column: span 24; }
.panel[data-h="4"] { grid-row: span 4; } .panel[data-h="6"] { grid-row: span 6; } .panel[data-h="8"] { grid-row: span 8; } .panel[data-h="10"] { grid-row: span 10; }
.ph { display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 6px 0 10px; flex: none; min-width: 0; }
.ph-title { border: 0; background: transparent; padding: 0; font: 500 13px var(--font-cond); letter-spacing: .01em; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; text-align: left; }
.ph-title:hover:not(:disabled) { color: var(--accent-2); }
.ph-title.static { cursor: default; }
.ph-sub { font: 11px var(--font-mono); color: var(--fg-3); margin-left: auto; white-space: nowrap; }
.ph-info { color: var(--fg-3); display: grid; cursor: help; }
.ph-flag { display: grid; cursor: help; }
.ph-flag.err { color: var(--crit); }
.ph-flag.warn { color: var(--warn); }
.ph-actions { margin-left: auto; display: flex; opacity: 0; transition: opacity .12s; }
.panel:hover .ph-actions, .panel:focus-within .ph-actions { opacity: 1; }
@media (hover: none) { .ph-actions { opacity: 1; } }
.pb { flex: 1; min-height: 0; padding: 0 10px 8px; display: flex; flex-direction: column; }
.pstate { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; color: var(--fg-3); font-size: 12.5px; padding: 8px; flex-direction: column; }
.pstate.err { flex-direction: row; text-align: left; color: var(--crit); align-items: flex-start; justify-content: flex-start; background: rgba(255, 95, 109, .06); border-radius: 4px; overflow: auto; }
.pstate.err div { display: flex; flex-direction: column; gap: 2px; }
.pstate.err span { color: var(--fg-2); font-family: var(--font-mono); font-size: 12px; word-break: break-word; }
.warn-t { color: var(--warn); font-size: 12px; }
.pskel { flex: 1; position: relative; overflow: hidden; border-radius: 4px; background: var(--bg-2); display: grid; place-items: center; color: var(--fg-3); font-size: 12px; }
.pskel span { position: relative; }
.shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255, 154, 60, .07) 50%, transparent 80%); animation: sh 1.2s infinite; }
@keyframes sh { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.panel.pending { border-color: rgba(255, 154, 60, .35); }

/* charts */
.ts { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ts-plot { flex: 1; min-height: 60px; position: relative; }
.ts-plot svg { position: absolute; inset: 0; overflow: visible; }
.grid { stroke: var(--line); stroke-width: 1; }
.axis { fill: var(--fg-3); font: 10.5px var(--font-mono); font-variant-numeric: tabular-nums; }
.annot line { stroke: var(--accent); stroke-dasharray: 3 3; stroke-opacity: .7; }
.annot path { fill: var(--accent); }
.xh { position: absolute; width: 1px; background: var(--fg-3); pointer-events: none; transform: translateX(-.5px); opacity: .6; }
.xh-dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; border: 2px solid; background: var(--panel); transform: translate(-50%, -50%); pointer-events: none; }
.tip { position: absolute; z-index: 5; min-width: 170px; max-width: 320px; background: #1b222d; border: 1px solid var(--line-2); border-radius: var(--r); padding: 7px 9px; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .7); pointer-events: none; font-size: 12px; }
.tip-t { font: 11px var(--font-mono); color: var(--fg-3); margin-bottom: 4px; }
.tip-r { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 7px; align-items: center; line-height: 1.7; }
.tip-r i { width: 8px; height: 3px; border-radius: 2px; }
.tip-r span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); }
.tip-r b { font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.tip-more { color: var(--fg-3); font-size: 11px; margin-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 0 12px; max-height: 42px; overflow: auto; padding-top: 4px; flex: none; }
.lg { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 1px 0; font-size: 11.5px; color: var(--fg-2); max-width: 100%; min-width: 0; }
.lg i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
.lg-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 11px; }
.lg-v { font: 11px var(--font-mono); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.lg.dim { opacity: .35; }
.lg:hover .lg-n { color: var(--fg); }
.hbars { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 7px; overflow: auto; padding: 2px 0; }
.hb { display: grid; grid-template-columns: minmax(70px, 34%) minmax(0, 1fr) 72px; gap: 10px; align-items: center; font-size: 12px; }
.hb-n { font: 11.5px var(--font-mono); color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-track { height: 14px; background: var(--bg-2); border-radius: 2px; overflow: hidden; }
.hb-fill { display: block; height: 100%; border-radius: 2px; }
.hb-v { font: 12px var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.vbars { flex: 1; min-height: 0; position: relative; }
.vbars svg { position: absolute; inset: 0; }
.stat { flex: 1; min-height: 0; display: grid; gap: 8px; }
.stat.n2 { grid-template-columns: 1fr 1fr; }
.stat.n3, .stat.n4 { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
.stat-cell { position: relative; display: flex; flex-direction: column; justify-content: center; min-width: 0; min-height: 0; container-type: size; overflow: hidden; }
.stat-name { font: 11px var(--font-mono); color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; z-index: 1; }
.stat-val { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 4px; font: 600 clamp(18px, min(34cqh, 17cqw), 44px)/1.05 var(--font-cond); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.stat-val small { font-size: .5em; font-weight: 500; opacity: .8; }
.stat-meta { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11.5px; color: var(--fg-2); white-space: nowrap; }
.delta { font-family: var(--font-mono); font-size: 11px; }
.delta em { font-style: normal; font-family: var(--font-ui); color: var(--fg-3); }
.spark { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; pointer-events: none; }
.spark svg { display: block; }
.stat-more { font-size: 11px; color: var(--fg-3); }
.empty { border: 1px dashed var(--line-2); border-radius: 8px; padding: 40px 20px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty span { color: var(--fg-3); max-width: 46ch; font-size: 13px; }
.foot { font-size: 12px; margin-top: 20px; }

/* ---------- panel editor ---------- */
.ed { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); }
.ed-h { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg-2); flex-wrap: wrap; }
.ed-crumb { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex: 1; font-size: 13px; }
.ed-crumb span { color: var(--fg-3); white-space: nowrap; }
.ed-crumb b { font-family: var(--font-cond); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-act { display: flex; gap: 8px; margin-left: auto; }
.ed-body { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 0; }
.ed-main { overflow: auto; padding: 16px; min-width: 0; }
.ed-preview { height: 320px; display: flex; }
.ed-preview .panel { flex: 1; }
.qs { margin-top: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 10px 14px 14px; }
.qs-tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qtab { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg-2); padding-right: 2px; max-width: 260px; min-width: 0; }
.qtab > button:first-child { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; height: 28px; padding: 0 8px; font: 12px var(--font-mono); color: var(--fg-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qtab.on { border-color: var(--accent); background: var(--accent-soft); }
.qtab.on > button:first-child { color: var(--fg); }
.qtab.off > button:first-child { text-decoration: line-through; opacity: .6; }
.ref { font: 600 11px var(--font-mono); color: var(--accent); }
.qe-wrap { position: relative; }
.qe { position: relative; border: 1px solid var(--line-2); border-radius: var(--r); background: #090c11; }
.qe:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.qe-hl, .qe textarea { margin: 0; padding: 10px 12px; font: 13px/1.6 var(--font-mono); white-space: pre-wrap; word-break: break-all; overflow-wrap: anywhere; tab-size: 2; letter-spacing: 0; }
.qe-hl { position: absolute; inset: 0; pointer-events: none; color: var(--fg); overflow: hidden; }
.qe textarea { position: relative; display: block; width: 100%; min-height: 64px; resize: none; background: transparent; border: 0; color: transparent; caret-color: var(--accent); outline: none; overflow: hidden; }
.qe textarea::placeholder { color: var(--fg-3); }
.qe textarea::selection { background: rgba(255, 154, 60, .28); color: transparent; }
.h-f { color: #6ea8fe; } .h-k { color: #c38bfa; } .h-m { color: #e8eef6; font-weight: 500; } .h-l { color: #40c4c4; }
.h-s { color: #e5c95a; } .h-d, .h-n { color: #ff9a3c; } .h-o { color: var(--fg-3); } .h-u { color: var(--fg-2); } .h-v { color: #c38bfa; }
.h-err { text-decoration: wavy underline var(--crit); text-underline-offset: 3px; }
.h-eof { display: inline-block; width: 8px; }
.sg { position: absolute; left: 0; top: calc(100% + 4px); z-index: 10; list-style: none; margin: 0; padding: 4px; min-width: 300px; max-width: 100%; background: #1b222d; border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .7); }
.sg li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 8px; border-radius: 4px; cursor: pointer; font: 12.5px var(--font-mono); }
.sg li.on, .sg li:hover:not(.sg-hint) { background: var(--panel-2); }
.sg-v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg-t { font-size: 10.5px; padding: 1px 5px; border-radius: 3px; color: var(--fg-3); background: var(--bg-2); }
.sg-hint { cursor: default !important; color: var(--fg-3); font: 11px var(--font-ui) !important; border-top: 1px solid var(--line); margin-top: 2px; }
.qstat { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--ok); }
.qstat .muted { color: var(--fg-3); }
.qstat .ico { margin-top: 2px; }
.qstat.err { color: var(--crit); }
.qwarn { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; font-size: 12px; color: var(--warn); }
.qwarn .ico { margin-top: 2px; }
.qexplain { margin-top: 10px; padding: 8px 10px; background: var(--bg-2); border-left: 2px solid var(--line-2); border-radius: 0 4px 4px 0; font-size: 12.5px; color: var(--fg-2); line-height: 1.6; }
.qexplain span { display: block; font-size: 11px; color: var(--fg-3); margin-bottom: 2px; }
.field-row { display: flex; gap: 12px; }
.field.grow { flex: 1; }
.labels-peek { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.labels-peek .lbl { margin: 0 4px 0 0; }
.labels-peek .chip { height: 22px; font-size: 11px; }
.ed-side { border-left: 1px solid var(--line); background: var(--bg-2); overflow: auto; padding: 4px 16px 24px; }
.opt { padding: 12px 0 14px; border-bottom: 1px solid var(--line); }
.opt h4 { margin: 0 0 2px; font: 600 11px var(--font-cond); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.opt .seg { margin-top: 10px; }
.opt .seg + .grid2 { margin-top: 2px; }
.th-row { display: grid; grid-template-columns: 12px 92px minmax(0, 1fr) 26px; gap: 8px; align-items: center; margin-top: 8px; }
.sw { width: 12px; height: 12px; border-radius: 3px; }
.th-base { font-size: 12px; color: var(--fg-3); }
.opt > .btn { margin-top: 10px; }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(4, 6, 9, .72); display: grid; place-items: center; padding: 16px; }
.modal { width: min(860px, 100%); max-height: calc(100% - 16px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8); min-height: 0; }
.modal-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.modal-h .seg { width: 220px; }
.modal-b { padding: 14px; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
.modal-f { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.modal-f .muted { font-size: 12px; margin-right: auto; }
.ex-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ex-bar .check { margin: 0; }
.ex-meta { display: flex; flex-direction: column; min-width: 0; }
.ex-meta span { font: 11.5px var(--font-mono); color: var(--fg-3); }
.json { margin: 12px 0 0; background: #080a0e; border: 1px solid var(--line); border-radius: var(--r); font: 12px/1.6 var(--font-mono); max-height: 46vh; overflow: auto; padding: 8px 0; }
.jl { display: grid; grid-template-columns: 44px auto; white-space: pre; }
.jn { color: #3b4553; text-align: right; padding-right: 12px; user-select: none; }
.j-k { color: #9ec4ff; } .j-s { color: #e5c95a; } .j-n { color: #ff9a3c; } .j-b { color: #c38bfa; }
.drop { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px dashed var(--line-2); border-radius: var(--r); background: var(--bg-2); flex-wrap: wrap; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop > .ico { color: var(--fg-3); }
.drop div { flex: 1; min-width: 200px; display: flex; flex-direction: column; font-size: 13px; }
.drop div span { color: var(--fg-3); font-size: 12px; }
.imp-h { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; gap: 8px; }
.imp-ta { min-height: 160px; max-height: 32vh; font-size: 12px; }
.imp-res { margin-top: 10px; padding: 10px 12px; border-radius: var(--r); font-size: 13px; }
.imp-res.err { display: flex; gap: 8px; color: var(--crit); background: rgba(255, 95, 109, .07); border: 1px solid rgba(255, 95, 109, .25); }
.imp-res.err .ico { margin-top: 2px; }
.imp-res.ok { background: rgba(70, 194, 142, .06); border: 1px solid rgba(70, 194, 142, .22); }
.imp-sum { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.imp-sum .ico { color: var(--ok); }
.imp-sum span { color: var(--fg-2); font-size: 12.5px; }
.imp-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; color: var(--fg-2); }
.imp-list li { display: flex; gap: 8px; align-items: center; }

.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: grid; gap: 8px; }
.toast { display: flex; align-items: center; gap: 12px; padding: 9px 10px 9px 14px; background: #1f2733; border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .7); font-size: 13px; animation: tin .18s ease-out; max-width: calc(100vw - 32px); }
.toast .btn { color: var(--accent); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .top .menu { display: inline-grid; }
  .side { position: fixed; top: var(--top-h); left: 0; bottom: 0; width: min(var(--side-w), 88vw); z-index: 30; transform: translateX(-102%); transition: transform .2s ease; box-shadow: 20px 0 40px -20px rgba(0, 0, 0, .8); }
  .side-open .side { transform: none; }
  .side-open .scrim { display: block; position: fixed; inset: var(--top-h) 0 0 0; background: rgba(4, 6, 9, .55); z-index: 25; }
}
@media (max-width: 900px) {
  .panel[data-w="6"], .panel[data-w="8"] { grid-column: span 12; }
  .panel[data-w="12"], .panel[data-w="16"], .panel[data-w="18"] { grid-column: span 24; }
  .ed-body { grid-template-columns: minmax(0, 1fr); overflow: auto; }
  .ed-main { overflow: visible; }
  .ed-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .ed { overflow: auto; }
  .ed-preview { height: 260px; }
}
@media (max-width: 600px) {
  .top { padding: 0 10px; gap: 6px; }
  .brand em, .hide-s { display: none; }
  .ds-pill { margin-left: 0; }
  .ds-pill .muted { display: none; }
  .main { padding: 14px 16px 28px; }
  .panel[data-kind="stat"] { grid-column: span 12 !important; }
  .panel:not([data-kind="stat"]) { grid-column: span 24 !important; }
  .plan-p { grid-template-columns: 16px 18px minmax(0, 1fr); }
  .plan-q { grid-column: 3; }
  .ed-act .btn:first-child { display: none; }
  .hb { grid-template-columns: minmax(60px, 38%) minmax(0, 1fr) 60px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
